{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modifier un Candidat – Soutenance IAI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{% static 'generator/css/style.css' %}?v=9" />
</head>
<body>

  <!-- Animated background -->
  <div class="bg-gradient"></div>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="page-wrapper">

    <!-- Header -->
    <header class="site-header">
      <div class="header-logo">
        <div class="logo-icon">🎓</div>
        <div>
          <h1 class="header-title">Flyer Soutenance</h1>
          <span class="header-subtitle">IAI Cameroun</span>
        </div>
      </div>
      <nav class="header-nav">
        <a href="{% url 'generator:home' %}" class="nav-link">Générateur</a>
        <a href="{% url 'generator:dashboard' %}" class="nav-link">Tableau de Bord</a>
        <a href="{% url 'generator:student_list' %}" class="nav-link">Étudiants</a>
        <a href="{% url 'generator:payment_transactions' %}" class="nav-link">Transactions</a>
        <a href="{% url 'generator:free_flyer_codes' %}" class="nav-link">Codes gratuits</a>
        <form method="post" action="{% url 'generator:logout' %}" class="nav-link-form">
          {% csrf_token %}
          <button type="submit" class="nav-link" style="color: #f87171;">🚪 Déconnexion</button>
        </form>
      </nav>
      <div class="header-badge">
        <span class="badge-dot"></span>
        Édition Admin
      </div>
    </header>

    <!-- Main layout -->
    <main class="main-layout" style="grid-template-columns: 1fr; max-width: 680px; margin: 0 auto;">
      <section class="form-panel glass-card">
        <div class="panel-header" style="display: flex; align-items: center; justify-content: space-between;">
          <div>
            <h2 class="panel-title">Modifier l'Étudiant</h2>
            <p class="panel-desc">Mettez à jour les informations du candidat.</p>
          </div>
          <a href="{% url 'generator:student_list' %}" class="btn btn-cancel" style="padding: 8px 14px; font-size: 0.82rem; text-decoration: none;">
            ← Annuler
          </a>
        </div>

        <form method="POST" action="{% url 'generator:edit_student' student.pk %}">
          {% csrf_token %}

          <!-- Nom complet -->
          <div class="form-group">
            <label class="form-label" for="full_name">👤 Nom Complet du Candidat *</label>
            <input class="form-input" type="text" id="full_name" name="full_name" value="{{ student.full_name }}" required />
          </div>

          <!-- Classe & Filière & Niveau -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="classe">🏫 Classe</label>
              <input class="form-input" type="text" id="classe" name="classe" value="{{ student.classe }}" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="filiere">📚 Filière</label>
              <select class="form-input" id="filiere" name="filiere">
                <option value="SR" {% if student.filiere == 'SR' %}selected{% endif %}>Système &amp; Réseaux (SR)</option>
                <option value="GL" {% if student.filiere == 'GL' %}selected{% endif %}>Génie Logiciel (GL)</option>
                <option value="SE" {% if student.filiere == 'SE' %}selected{% endif %}>Software Engineering (SE)</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="niveau">🎓 Niveau</label>
              <select class="form-input" id="niveau" name="niveau">
                <option value="N2" {% if student.niveau == 'N2' %}selected{% endif %}>Niveau 2 (N2)</option>
                <option value="N3" {% if student.niveau == 'N3' %}selected{% endif %}>Niveau 3 (N3)</option>
              </select>
            </div>
          </div>

          <!-- Thème -->
          <div class="form-group">
            <label class="form-label" for="theme">📋 Thème / Sujet du Projet</label>
            <textarea class="form-input form-textarea" id="theme" name="theme" rows="3">{{ student.theme }}</textarea>
          </div>

          <!-- Encadreurs -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="academic_supervisor">🎓 Encadreur Académique</label>
              <input class="form-input" type="text" id="academic_supervisor" name="academic_supervisor" value="{{ student.academic_supervisor }}" />
            </div>
            <div class="form-group">
              <label class="form-label" for="professional_supervisor">💼 Encadreur Professionnel</label>
              <input class="form-input" type="text" id="professional_supervisor" name="professional_supervisor" value="{{ student.professional_supervisor }}" />
            </div>
          </div>

          <!-- Accessoires -->
          <div class="form-group">
            <label class="form-label">🎓 Accessoires &amp; Frais</label>
            <div class="checkbox-row">
              <label class="checkbox-container">
                <input type="checkbox" id="toge" name="toge" value="1" {% if student.toge %}checked{% endif %} />
                <span class="checkbox-custom"></span>
                <span class="checkbox-label">Toge (+5 000)</span>
              </label>
              <label class="checkbox-container">
                <input type="checkbox" id="echarpe" name="echarpe" value="1" {% if student.echarpe %}checked{% endif %} />
                <span class="checkbox-custom"></span>
                <span class="checkbox-label">Écharpe (+3 000)</span>
              </label>
              <label class="checkbox-container">
                <input type="checkbox" id="frais_soutenance" name="frais_soutenance" value="1" {% if student.frais_soutenance %}checked{% endif %} />
                <span class="checkbox-custom"></span>
                <span class="checkbox-label">Frais Soutenance</span>
              </label>
            </div>
          </div>

          <!-- Actions -->
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" style="flex: 2;">
              <span class="btn-icon">💾</span>
              <span>Enregistrer les Modifications</span>
            </button>
            <a href="{% url 'generator:student_list' %}" class="btn btn-cancel" style="flex: 1; text-align: center; text-decoration: none; justify-content: center;">
              Annuler
            </a>
          </div>

        </form>
      </section>
    </main>
  </div>

</body>
</html>
