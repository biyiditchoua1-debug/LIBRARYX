{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Administration – Soutenance IAI</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{% static 'generator/css/style.css' %}" />
</head>
<body>

  <!-- Animated background -->
  <div class="bg-gradient"></div>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="page-wrapper" style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">

    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 40px; border-radius: 20px;">
      
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="font-size: 3rem; margin-bottom: 8px;">🔐</div>
        <h1 class="panel-title" style="font-size: 1.6rem; margin-bottom: 6px;">Espace Administration</h1>
        <p class="panel-desc">Connectez-vous pour accéder au tableau de bord et à la gestion des étudiants.</p>
      </div>

      {% if error_message %}
        <div style="margin-bottom: 20px; padding: 12px 16px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 10px; color: #f87171; font-size: 0.9rem; text-align: center;">
          ⚠️ {{ error_message }}
        </div>
      {% endif %}

      <form method="POST" action="{% url 'generator:login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}" />

        <div class="form-group" style="margin-bottom: 18px;">
          <label class="form-label" for="username">👤 Nom d'utilisateur</label>
          <input class="form-input" type="text" id="username" name="username" placeholder="Entrez votre identifiant" required autofocus />
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="password">🔑 Mot de passe</label>
          <input class="form-input" type="password" id="password" name="password" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px; font-size: 1rem; border-radius: 12px;">
          <span>Se Connecter</span>
          <span class="btn-icon">➔</span>
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center;">
        <a href="{% url 'generator:home' %}" style="color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.85rem;">
          ← Retour au Générateur de Flyers
        </a>
      </div>

    </div>

  </div>

</body>
</html>
